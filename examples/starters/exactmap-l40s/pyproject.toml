[project]
name = "exactmap-l40s-candidate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.2",
  "fastapi>=0.115",
  "huggingface-hub>=0.30",
  "httpx>=0.27",
  "modal>=1.5.2",
  "pydantic>=2.0",
  "safetensors>=0.5",
  "torch>=2.7",
  "transformers==4.53.2",
  "triton>=3.3; sys_platform == 'linux'",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", "artifacts"]
