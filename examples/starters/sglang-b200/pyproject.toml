[project]
name = "sglang-b200-candidate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "sglang[all]==0.5.17",
  "transformers>=4.53.2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.0",
  "modal>=1.5.2",
  "pydantic>=2.0",
  "pytest>=8.0",
  "tomli>=2.0; python_version < '3.11'",
  "uvicorn>=0.30",
  "vs-bench",
]

[tool.uv]
package = false

[tool.uv.sources]
vs-bench = { path = "../../../sdk/vs-bench" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", "sglang"]
