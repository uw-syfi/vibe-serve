version = 1

[agent]
domain = "llm-serving"

[accuracy]
command = [
  "uv", "run", "--no-project", "--with-requirements",
  ".vibesys/tasks/qwen3-coder-tracelab-h100/requirements.txt",
  "python",
  ".vibesys/tasks/qwen3-coder-tracelab-h100/accuracy_checker/checker.py",
]
timeout_seconds = 900

[benchmark]
command = [
  "uv",
  "run",
  "--no-project",
  "--with-requirements",
  ".vibesys/tasks/qwen3-coder-tracelab-h100/requirements.txt",
  "python",
  ".vibesys/tasks/qwen3-coder-tracelab-h100/benchmark/benchmark.py",
]
timeout_seconds = 3600

[benchmark.result]
json_argument = "--output-json"
metric = "aggregate_output_tokens_per_second"
