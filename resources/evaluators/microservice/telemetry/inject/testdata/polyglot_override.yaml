services:
    api:
        environment:
            JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
            OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
            OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
            OTEL_LOGS_EXPORTER: none
            OTEL_METRICS_EXPORTER: none
            OTEL_SERVICE_NAME: api
            OTEL_TRACES_EXPORTER: otlp
            OTEL_TRACES_SAMPLER: parentbased_traceidratio
            OTEL_TRACES_SAMPLER_ARG: "0.25"
        volumes:
            - /workspace/agents/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.157.0
        user: "0"
        command:
            - --config=/etc/otelcol/config.yaml
        volumes:
            - /workspace/metrics/otel/otelcol-config.yaml:/etc/otelcol/config.yaml:ro
            - /workspace/metrics/otel:/var/lib/otelcol
    web:
        environment:
            NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
            OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
            OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
            OTEL_LOGS_EXPORTER: none
            OTEL_METRICS_EXPORTER: none
            OTEL_SERVICE_NAME: web
            OTEL_TRACES_EXPORTER: otlp
            OTEL_TRACES_SAMPLER: parentbased_traceidratio
            OTEL_TRACES_SAMPLER_ARG: "0.25"
    worker:
        environment:
            OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
            OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
            OTEL_LOGS_EXPORTER: none
            OTEL_METRICS_EXPORTER: none
            OTEL_SERVICE_NAME: worker
            OTEL_TRACES_EXPORTER: otlp
            OTEL_TRACES_SAMPLER: parentbased_traceidratio
            OTEL_TRACES_SAMPLER_ARG: "0.25"
