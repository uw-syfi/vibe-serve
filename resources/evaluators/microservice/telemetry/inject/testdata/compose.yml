version: "3.8"

services:
  frontend:
    build: .
    image: example/frontend:latest
    environment:
      - JAEGER_SAMPLE_RATIO
    ports:
      - "5000:5000"

  search:
    build: .
    image: example/search:latest
    environment:
      - JAEGER_SAMPLE_RATIO

  api:
    image: example/api:latest

  worker:
    image: example/worker:latest

  web:
    image: example/web:latest

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "6831:6831/udp"

  mongodb-search:
    image: mongo:5.0
