# Shared OpenTelemetry Collector configuration for microservice scenarios.
# The jaeger receiver lets the collector impersonate a scenario's existing
# Jaeger endpoint (jaeger-native runtime); otlp and zipkin cover agent-based
# runtimes. Spans are appended as OTLP protojson NDJSON for cmd/otelcapture.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_binary:
        endpoint: 0.0.0.0:6832
  zipkin:
    endpoint: 0.0.0.0:9411

processors:
  batch: {}

exporters:
  file:
    path: /var/lib/otelcol/traces.otlp.ndjson
    flush_interval: 1s

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [batch]
      exporters: [file]
