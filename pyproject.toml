[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesys"
version = "0.1.0"
description = "AI agent framework for generating bespoke systems from application, workload, and hardware requirements"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentshim>=0.5.0",
    "deepagents",
    "jinja2>=3.1",
    "langchain-google-vertexai>=3.2.2",
    "langchain-openai",
    "huggingface_hub",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "vs-feature-flags",
    "vs-github",
    "vs-issue-board",
    "vs-sandbox",
    "openevolve==0.3.1",
]

[project.optional-dependencies]
# Opt-in backend behind the `omnigent_agent_backend` feature flag. Kept out of
# the base dependencies because it is a fast-moving alpha with no stability
# policy — see docs/omnigent-evaluation.md — so end users who never enable the
# flag should not carry it. Install with `uv sync --extra omnigent`.
omnigent = ["omnigent==0.6.0"]

[project.scripts]
vibesys-issue-mcp = "vs_issue_board.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vibesys*"]

[tool.setuptools.package-data]
vibesys = ["templates/*.j2", "templates/_backend/*/*.j2", "domains/README.md", "domains/*/templates/*.md", "loops/agent/templates/*.j2", "loops/agent/templates/profilers/*.j2", "loops/agent/templates/_modality/*/*.j2", "loops/evolve/templates/*.j2", "loops/plain/templates/*.j2", "loops/plain/templates/*/*.j2"]

[dependency-groups]
dev = [
    "chardet<6",
    "diff-cover",
    "hypothesis",
    "matplotlib>=3.10.8",
    "pyright>=1.1.411",
    "pytest",
    "pytest-cov",
    "ruff>=0.6",
    # Optional for users, required for contributors: without it pyright cannot
    # resolve the Omnigent backend and its tests silently skip. `uv sync --dev`
    # (what CI runs) therefore installs it. Version comes from the extra, so
    # there is one pin.
    "vibesys[omnigent]",
]
test = [
    "hypothesis",
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests", "libs/vs-feature-flags/tests", "libs/vs-github/tests", "libs/vs-issue-board/tests", "libs/vs-sandbox/tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "libs/vs-feature-flags/src", "libs/vs-feature-flags/tests", "libs/vs-github/src", "libs/vs-github/tests", "libs/vs-issue-board/src", "libs/vs-issue-board/tests", "libs/vs-sandbox/src", "libs/vs-sandbox/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "E501",
    # PEP 695 type-parameter syntax (`def f[T]()`, `class C[T]`, `type X = ...`)
    # only becomes lintable at target-version py312, so raising the floor
    # surfaced 11 of these at once. The repo has not adopted that syntax, and
    # this is not the change to adopt it in: ruff marks the rewrites unsafe,
    # and the hits include vendored reference code under `resources/skills/`
    # that VibeSys does not own. Moving to PEP 695 is a separate decision.
    "UP040",
    "UP046",
    "UP047",
]

[tool.pyright]
typeCheckingMode = "strict"
# Strict minus the three rules below: untyped third-party dependencies
# (deepagents, langchain, modal, docker SDKs) leak Unknown into member
# accesses, inferred variables, and call arguments throughout the agent
# runner and loop code. Declared annotations remain fully enforced via
# reportUnknownParameterType / reportMissingParameterType /
# reportMissingTypeArgument, which stay at strict defaults.
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
pythonVersion = "3.12"
include = ["src", "libs/vs-feature-flags/src", "libs/vs-github/src", "libs/vs-issue-board/src", "libs/vs-sandbox/src"]
executionEnvironments = [
    { root = "libs/vs-feature-flags/src" },
    { root = "libs/vs-github/src" },
    { root = "libs/vs-issue-board/src" },
    { root = "libs/vs-sandbox/src" },
    { root = "src" },
]

[tool.uv]
package = true

[tool.uv.workspace]
exclude = ["exp_env/**"]
members = ["libs/*"]

[tool.uv.sources]
vs-feature-flags = { workspace = true }
vs-github = { workspace = true }
vs-issue-board = { workspace = true }
vs-sandbox = { workspace = true }
