[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-evaluator-protocol"
version = "0.1.0"
description = "Framework-side reader for the VibeSys evaluator result protocol"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vs_evaluator_protocol*"]

[tool.setuptools.package-data]
vs_evaluator_protocol = ["py.typed"]
