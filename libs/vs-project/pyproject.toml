[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-project"
version = "0.1.0"
description = "Repository-native project layout and state for VibeSys"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2",
    "vs-loop-state",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vs_project*"]

[tool.setuptools.package-data]
vs_project = ["py.typed"]
