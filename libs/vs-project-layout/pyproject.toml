[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-project-layout"
version = "0.1.0"
description = "Repository-native task layout and discovery for VibeSys"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vs_project_layout*"]

[tool.setuptools.package-data]
vs_project_layout = ["py.typed"]
