name: Build and publish release wheels

on:
  pull_request:
    branches: [main]
    # Skip the wheel-build matrix (two paid macOS runners plus a Docker
    # clean-room verification pass) for changes that can't affect native
    # packaging: pure documentation and the Docusaurus site. Ignored by exact
    # filename, not `.github/workflows/**`, so edits to this workflow still
    # run the full matrix. `release` events don't support path filters and
    # are unaffected.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'release' && 'pypi-production' || github.ref }}
  cancel-in-progress: false

jobs:
  release-context:
    name: Validate release context
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.24"

      - name: Set up Python
        run: uv python install 3.12

      - name: Validate source and tag versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == release ]]; then
            uv run python scripts/check_release_version.py --tag "refs/tags/$RELEASE_TAG"
          else
            uv run python scripts/check_release_version.py
          fi

      - name: Require the released commit to be on main
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin main
          release_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$release_commit" origin/main

  build:
    name: Build ${{ matrix.target }}
    needs: release-context
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.24"

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm 11.11.0
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Fetch verified Bun 1.3.9
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/fetch_bun.py --target "$TARGET" --output "$RUNNER_TEMP/vibesys-bun/bin/bun"

      - name: Build one native wheel
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/release
          uv run python scripts/build_release_wheel.py \
            --target "$TARGET" \
            --bun "$RUNNER_TEMP/vibesys-bun/bin/bun" \
            --output-dir dist/release

      - name: Verify static and native compatibility contracts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -- dist/release/*.whl
          test "$#" -eq 1
          test -f "$1"
          uv run python scripts/verify_release_wheel.py "$1" --target "$TARGET"
          uv run python scripts/audit_release_wheel.py "$1" --target "$TARGET"
          if [[ "$TARGET" == linux-* ]]; then
            uv run auditwheel show "$1"
          fi

      - name: Verify the installed wheel with a sanitized PATH
        run: |
          set -- dist/release/*.whl
          wheel="$(cd "$(dirname "$1")" && pwd -P)/$(basename "$1")"
          runtime_parent="$(cd "$RUNNER_TEMP" && pwd -P)"
          runtime_root="$runtime_parent/vibesys-installed"
          bootstrap_bin="$runtime_root/bootstrap-bin"
          tool_bin="$runtime_root/tool-bin"
          tool_root="$runtime_root/tools"
          install_home="$runtime_root/install-home"
          verify_home="$runtime_root/verify-home"
          mkdir -p "$bootstrap_bin" "$tool_bin" "$tool_root" "$install_home" "$verify_home"
          test -z "$(find "$install_home" -mindepth 1 -print -quit)"
          test -z "$(find "$verify_home" -mindepth 1 -print -quit)"
          cp "$(command -v uv)" "$bootstrap_bin/uv"
          cp "$GITHUB_WORKSPACE/scripts/verify_installed_release.py" \
            "$runtime_root/verify_installed_release.py"
          install_wheel="$runtime_root/$(basename "$wheel")"
          cp "$wheel" "$install_wheel"
          python_path="$(uv python find 3.12)"
          clean_path="$tool_bin:$bootstrap_bin:/usr/bin:/bin"
          HOME="$install_home" PATH="$clean_path" PYTHONNOUSERSITE=1 PYTHONPATH="" \
            UV_CACHE_DIR="$runtime_root/uv-cache" UV_PYTHON_DOWNLOADS=never \
            UV_TOOL_BIN_DIR="$tool_bin" UV_TOOL_DIR="$tool_root" \
            "$bootstrap_bin/uv" tool install --no-cache --no-config \
              --python "$python_path" "$install_wheel"
          rm "$install_wheel"
          cd "$runtime_root"
          HOME="$verify_home" PATH="$clean_path" PYTHONNOUSERSITE=1 PYTHONPATH="" \
            UV_CACHE_DIR="$runtime_root/uv-cache" UV_PYTHON_DOWNLOADS=never \
            UV_TOOL_BIN_DIR="$tool_bin" UV_TOOL_DIR="$tool_root" \
            VIBESYS_RELEASE_RUNTIME_ROOT="$runtime_root" \
            "$tool_root/vibesys/bin/python" "$runtime_root/verify_installed_release.py"

      - name: Verify Linux x86-64 in the Docker clean room
        if: matrix.target == 'linux-x86_64'
        run: ./scripts/test_release_wheel.sh dist/release/*.whl

      - name: Upload one target wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-${{ matrix.target }}
          path: dist/release/*.whl
          if-no-files-found: error

  aggregate:
    name: Verify release artifact set
    needs: [release-context, build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.24"

      - name: Set up Python
        run: uv python install 3.12

      - name: Download all target wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-wheel-*
          path: dist/release
          merge-multiple: true

      - name: Require exact versions and statically verify all wheels
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == release ]]; then
            uv run python scripts/check_release_version.py \
              --tag "refs/tags/$RELEASE_TAG" --wheel-dir dist/release
          else
            uv run python scripts/check_release_version.py --wheel-dir dist/release
          fi
          uv run python - <<'PY'
          from pathlib import Path
          from scripts.check_release_version import check_release_version
          from scripts.verify_release_wheel import verify_wheel
          from wheel_targets import TARGETS

          root = Path.cwd()
          wheel_dir = root / "dist" / "release"
          version = check_release_version(None, source_root=root)
          for target in TARGETS.values():
              wheel = wheel_dir / f"vibesys-{version}-py3-none-{target.wheel_platform}.whl"
              verify_wheel(wheel, root, target)
          PY

      - name: Upload aggregate-verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/release/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: aggregate
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      actions: read
      id-token: write

    steps:
      - name: Download only the aggregate-verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/release

      - name: Require exactly four wheels and no sdist
        run: |
          test "$(find dist/release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 4
          test "$(find dist/release -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" -eq 4

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/release
          attestations: true
